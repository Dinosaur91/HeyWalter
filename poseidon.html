<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Abyss</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
        }

        /* ── SCENE ENTER — plunge from surface, eyes adjust to the dark ── */
        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
            animation: plungeSettle 1.6s ease-out forwards;
        }
        @keyframes plungeSettle {
            from { filter: brightness(3.5) blur(12px) saturate(0); transform: scale(1.08); }
            to   { filter: brightness(1)   blur(0)    saturate(1); transform: scale(1); }
        }

        /* ── ABYSS BACKGROUND — near-total darkness, ancient deep ── */
        .abyss-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                #000000  0%,
                #000306  18%,
                #00080f  34%,
                #000d1a  52%,
                #001228  68%,
                #001530  82%,
                #000e22  100%
            );
        }

        /* ── ABYSS GLOW — something ancient pulses far below ── */
        .abyss-glow {
            position: absolute;
            bottom: -10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 60%;
            background: radial-gradient(ellipse at 50% 100%,
                rgba(0,55,75,0.50) 0%,
                rgba(0,30,50,0.22) 45%,
                transparent 75%
            );
            animation: abyssPulse 7s ease-in-out infinite alternate;
            pointer-events: none;
        }
        @keyframes abyssPulse {
            from { opacity: 0.6; transform: translateX(-50%) scaleX(1); }
            to   { opacity: 1;   transform: translateX(-50%) scaleX(1.1); }
        }

        /* ── DEEP SHADOWS — vast shapes in the dark ── */
        .deep-shape {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: shapeDrift ease-in-out infinite alternate;
        }
        .deep-shape:nth-child(1) {
            width: 55vw; height: 35vh;
            background: radial-gradient(ellipse, rgba(0,35,55,0.22), transparent);
            filter: blur(50px);
            top: 15%; left: -10%;
            animation-duration: 28s;
        }
        .deep-shape:nth-child(2) {
            width: 45vw; height: 28vh;
            background: radial-gradient(ellipse, rgba(0,25,45,0.18), transparent);
            filter: blur(60px);
            top: 55%; right: -8%;
            animation-duration: 34s; animation-delay: 6s;
        }
        .deep-shape:nth-child(3) {
            width: 38vw; height: 40vh;
            background: radial-gradient(ellipse, rgba(0,40,60,0.16), transparent);
            filter: blur(45px);
            top: 30%; left: 35%;
            animation-duration: 22s; animation-delay: 3s;
        }
        @keyframes shapeDrift {
            from { transform: translate(0,   0)   scaleY(1);    opacity: 0.5; }
            to   { transform: translate(4vw, 3vh) scaleY(1.08); opacity: 1;   }
        }

        /* ── BIOLUMINESCENT PARTICLE ── */
        .bio {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: bioPulse ease-in-out infinite, bioDrift linear forwards;
        }
        @keyframes bioPulse {
            0%, 100% { opacity: 0.02; }
            50%       { opacity: var(--peak, 0.28); }
        }
        @keyframes bioDrift {
            0%   { transform: translate(0, 0); }
            100% { transform: translate(var(--dx, 8px), var(--dy, -40px)); opacity: 0; }
        }

        /* ── FISH ── */
        .fish {
            position: absolute;
            pointer-events: none;
            left: 0;
            /* opacity driven by swim keyframes */
        }
        .fish svg { width: 100%; height: 100%; display: block; }

        @keyframes swimRight {
            0%   { transform: translateX(-18vw) translateY(0px);   opacity: 0; }
            6%   { opacity: 0.60; }
            25%  { transform: translateX(24vw)  translateY(-16px); }
            50%  { transform: translateX(52vw)  translateY( 10px); }
            75%  { transform: translateX(76vw)  translateY(-12px); }
            94%  { opacity: 0.60; }
            100% { transform: translateX(118vw) translateY(0px);   opacity: 0; }
        }
        @keyframes swimLeft {
            0%   { transform: translateX(118vw) translateY(0px);   opacity: 0; }
            6%   { opacity: 0.60; }
            25%  { transform: translateX(76vw)  translateY(-16px); }
            50%  { transform: translateX(52vw)  translateY( 10px); }
            75%  { transform: translateX(24vw)  translateY(-12px); }
            94%  { opacity: 0.60; }
            100% { transform: translateX(-18vw) translateY(0px);   opacity: 0; }
        }

        /* ── VIGNETTE — crushing pressure at the edges ── */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 20%, rgba(0,2,6,0.92) 100%);
            pointer-events: none;
        }

        /* ── DOORWAY ── */
        .door-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .door-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(240px, 32vw, 340px);
            opacity: 0;
            animation: doorReveal 1s 1.5s ease-out forwards;
        }
        @keyframes doorReveal {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .door-arch {
            width: 100%;
            height: clamp(130px, 17vw, 200px);
            border: 1px solid #0e4a5e;
            border-bottom: none;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a6a82;
            background: rgba(0,20,30,0.40);
            box-shadow: 0 0 28px rgba(20,130,170,0.18), inset 0 0 40px rgba(0,80,110,0.12);
        }
        .door-body {
            width: 100%;
            border: 1px solid #0e4a5e;
            border-top: none;
            padding: 24px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: rgba(0,20,30,0.40);
        }
        .door-input {
            font-family: 'Cinzel', serif;
            font-size: 0.88rem;
            letter-spacing: 0.5em;
            text-align: center;
            color: #2a8aaa;
            background: transparent;
            border: none;
            border-bottom: 1px solid #0e4a5e;
            width: 100%;
            padding: 8px 0;
            outline: none;
            caret-color: #2a8aaa;
        }
        .door-input::placeholder { color: rgba(42,138,170,0.3); }
        .door-error {
            font-family: 'Cinzel', serif;
            font-size: 0.66rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(80,200,200,0.85);
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 16px;
        }
        .door-proceed {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.70rem, 1.5vw, 0.85rem);
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: #2a8aaa;
            background: transparent;
            border: 1px solid #0e4a5e;
            padding: 0.75em 2.4em;
            cursor: pointer;
            transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
            margin-top: 4px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .door-proceed:hover {
            color: #55c0de;
            border-color: #1e7a94;
            box-shadow: 0 0 22px rgba(20,130,170,0.35);
        }
        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }
        .door-input.shake { animation: inputShake 0.45s ease-in-out; }

        /* ── EXIT OVERLAY ── */
        #exit-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
        }

        @media (max-width: 600px) {
            .door-frame   { width: clamp(170px, 72vw, 230px); }
            .door-arch    { height: 88px; }
            .door-body    { padding: 16px 20px 20px; gap: 12px; }
            .door-proceed { font-size: 0.70rem; letter-spacing: 0.28em; padding: 0.65em 1.8em; }
        }
    </style>
</head>
<body>
    <div id="exit-overlay"></div>

    <div class="scene" id="scene">
        <div class="abyss-bg"></div>

        <!-- Vast deep-sea shapes glimpsed in the dark -->
        <div class="deep-shape"></div>
        <div class="deep-shape"></div>
        <div class="deep-shape"></div>

        <!-- Ancient glow from far below -->
        <div class="abyss-glow"></div>

        <div class="vignette"></div>

        <div class="door-wrap">
            <div class="door-frame" id="doorFrame">
                <div class="door-arch">
                    <svg viewBox="0 0 30 50" width="38" height="60" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.55">
                        <line x1="15" y1="22" x2="15" y2="46"/>
                        <line x1="6" y1="30" x2="24" y2="30"/>
                        <line x1="15" y1="22" x2="15" y2="8"/>
                        <polyline points="12,14 15,8 18,14"/>
                        <line x1="6" y1="30" x2="6" y2="16"/>
                        <polyline points="3.5,22 6,16 8.5,22"/>
                        <line x1="24" y1="30" x2="24" y2="16"/>
                        <polyline points="21.5,22 24,16 26.5,22"/>
                    </svg>
                </div>
                <div class="door-body">
                    <input type="password" class="door-input" id="doorInput" placeholder="· · · ·" maxlength="12" autocomplete="off">
                    <div class="door-error" id="doorError">denied</div>
                    <button class="door-proceed" id="doorProceed">proceed</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ── BIOLUMINESCENT PARTICLES ── */
        const scene = document.getElementById('scene');
        const colors = [
            'rgba(0,170,150,', // deep teal
            'rgba(0,100,130,', // dark cyan
            'rgba(40,160,180,', // bioluminescent teal
            'rgba(80,200,200,', // brighter teal
            'rgba(160,230,240,', // pale cyan
        ];

        function spawnBio() {
            const el    = document.createElement('div');
            el.className = 'bio';
            const sz    = 1 + Math.random() * 3.5;
            const col   = colors[Math.floor(Math.random() * colors.length)];
            const peak  = (0.12 + Math.random() * 0.30).toFixed(2);
            const pulseDur = 3 + Math.random() * 8;
            const driftDur = 20 + Math.random() * 40;
            const dx    = ((Math.random() * 40 - 20) | 0) + 'px';
            const dy    = -20 - (Math.random() * 60 | 0) + 'px';
            el.style.cssText = [
                `width:${sz}px`,
                `height:${sz}px`,
                `left:${Math.random() * 100}%`,
                `top:${10 + Math.random() * 85}%`,
                `background:${col}0.9)`,
                `box-shadow:0 0 ${sz * 3}px ${sz}px ${col}0.25)`,
                `--peak:${peak}`,
                `--dx:${dx}`,
                `--dy:${dy}`,
                `animation-duration:${pulseDur}s, ${driftDur}s`,
                `animation-delay:${(Math.random() * -pulseDur).toFixed(1)}s, 0s`
            ].join(';');
            scene.appendChild(el);
            setTimeout(() => el.remove(), driftDur * 1000);
        }

        for (let i = 0; i < 55; i++) setTimeout(spawnBio, i * 120);
        setInterval(spawnBio, 1500);

        /* ── FISH ── */
        // Three SVG shapes for variety
        const fishShapes = [
            // Classic fish
            `<svg viewBox="0 0 110 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="62" cy="24" rx="40" ry="17" fill="rgba(0,50,68,0.62)"/>
                <path d="M22,24 L3,7 L3,41 Z" fill="rgba(0,42,58,0.62)"/>
                <path d="M48,7 Q60,15 72,7" stroke="rgba(0,72,95,0.55)" stroke-width="2.5" fill="none" stroke-linecap="round"/>
                <path d="M70,30 Q78,40 64,40 Q68,35 70,30 Z" fill="rgba(0,46,62,0.55)"/>
                <circle cx="88" cy="20" r="4"   fill="rgba(0,155,175,0.55)"/>
                <circle cx="89" cy="19" r="1.5" fill="rgba(190,245,255,0.80)"/>
            </svg>`,
            // Longer, eel-like fish
            `<svg viewBox="0 0 130 36" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="72" cy="18" rx="52" ry="12" fill="rgba(0,40,58,0.58)"/>
                <path d="M20,18 L2,6 L2,30 Z" fill="rgba(0,32,48,0.58)"/>
                <path d="M38,6 Q55,12 72,6" stroke="rgba(0,65,85,0.50)" stroke-width="2" fill="none" stroke-linecap="round"/>
                <circle cx="106" cy="15" r="3.5" fill="rgba(0,140,165,0.52)"/>
                <circle cx="107" cy="14" r="1.2" fill="rgba(190,245,255,0.75)"/>
            </svg>`,
            // Small round lanternfish
            `<svg viewBox="0 0 68 42" fill="none" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="38" cy="21" rx="24" ry="17" fill="rgba(0,45,62,0.65)"/>
                <path d="M14,21 L2,10 L2,32 Z" fill="rgba(0,36,52,0.65)"/>
                <circle cx="54" cy="17" r="5"   fill="rgba(0,170,185,0.60)"/>
                <circle cx="55" cy="16" r="2"   fill="rgba(200,250,255,0.85)"/>
                <path d="M34,4 Q40,10 46,4" stroke="rgba(0,68,88,0.55)" stroke-width="2" fill="none" stroke-linecap="round"/>
            </svg>`
        ];

        function spawnFish() {
            const goRight = Math.random() > 0.5;
            const shape   = fishShapes[Math.floor(Math.random() * fishShapes.length)];
            const h       = 22 + Math.random() * 38;          // height 22–60px
            const w       = h * (Math.random() > 0.5 ? 2.4 : 1.8); // width proportional
            const top     = 8 + Math.random() * 76;            // 8–84% from top
            const dur     = 10 + Math.random() * 11;           // 10–21s crossing time

            const el = document.createElement('div');
            el.className = 'fish';
            el.style.cssText = [
                `width:${w}px`,
                `height:${h}px`,
                `top:${top}%`,
                `animation: swim${goRight ? 'Right' : 'Left'} ${dur}s linear forwards`
            ].join(';');

            // Flip SVG horizontally when swimming left
            el.innerHTML = `<svg viewBox="${shape.match(/viewBox="([^"]+)"/)[1]}" fill="none"
                style="transform:scaleX(${goRight ? 1 : -1}); width:100%; height:100%">
                ${shape.replace(/^<svg[^>]*>/, '').replace(/<\/svg>$/, '')}
            </svg>`;

            scene.appendChild(el);
            setTimeout(() => el.remove(), (dur + 2) * 1000);
        }

        function scheduleFish() {
            const delay = 7000 + Math.random() * 11000;   // next fish in 7–18 s
            setTimeout(() => { spawnFish(); scheduleFish(); }, delay);
        }

        // First fish after 3–6 s, then keep scheduling
        setTimeout(() => { spawnFish(); scheduleFish(); }, 3000 + Math.random() * 3000);

        /* ── DOORWAY ── */
        const doorInput   = document.getElementById('doorInput');
        const doorError   = document.getElementById('doorError');
        const doorProceed = document.getElementById('doorProceed');

        async function tryEnter() {
            const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(doorInput.value));
            const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
            if (hex === '03ac674216f3e15c761ee1a5e255f067953623c8b388b4459e13f978d7c846f4') {
                sessionStorage.setItem('mt_key', hex);
                const exit = document.getElementById('exit-overlay');
                exit.style.opacity = '1';
                exit.style.pointerEvents = 'all';
                setTimeout(() => { window.location.href = 'wander.html'; }, 750);
            } else {
                doorInput.classList.remove('shake');
                void doorInput.offsetWidth;
                doorInput.classList.add('shake');
                doorError.style.opacity = '1';
                doorInput.value = '';
                setTimeout(() => {
                    doorError.style.opacity = '0';
                    doorInput.classList.remove('shake');
                }, 1400);
            }
        }

        doorProceed.addEventListener('click', tryEnter);
        doorInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
    </script>
</body>
</html>
