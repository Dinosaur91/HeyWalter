<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olympus</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #050400;
        }

        /* ── SCENE ENTER — arrive in blinding flash, storm settles ── */
        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            overflow: hidden;
            animation: stormSettle 1.6s ease-out forwards;
        }
        @keyframes stormSettle {
            from { filter: brightness(6) blur(12px); transform: scale(1.1) translateY(4%); }
            to   { filter: brightness(1) blur(0);    transform: scale(1)   translateY(0); }
        }

        /* ── STORM SKY BACKGROUND — sickly pre-storm amber/olive ── */
        .storm-bg {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                #040300  0%,
                #0a0900  14%,
                #100e02  28%,
                #181504  44%,
                #1e1b06  60%,
                #141208  76%,
                #0c0a04  90%,
                #060500  100%
            );
        }

        /* Sickly sulphurous haze that hangs in the mid-sky */
        .yellow-haze {
            position: absolute;
            inset: 0;
            background:
                radial-gradient(ellipse at 50% 38%, rgba(80,72,0,0.22) 0%, transparent 65%),
                radial-gradient(ellipse at 20% 55%, rgba(60,52,0,0.12) 0%, transparent 50%),
                radial-gradient(ellipse at 78% 42%, rgba(70,60,0,0.14) 0%, transparent 45%);
            pointer-events: none;
            animation: hazePulse 9s ease-in-out infinite alternate;
        }
        @keyframes hazePulse {
            from { opacity: 0.7; }
            to   { opacity: 1;   }
        }

        /* ── STORM CLOUDS — heavy, dark olive/khaki, pre-apocalyptic ── */
        .cloud {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(ellipse, rgba(52,48,18,0.92), rgba(20,18,4,0));
            filter: blur(32px);
            pointer-events: none;
            animation: cloudDrift linear infinite alternate;
        }
        .cloud-1  { top: 5%;  left: -8%;  width: 50vw; height: 22vh; opacity: 0.90; animation-duration: 55s; }
        .cloud-2  { top: 18%; right: -6%; width: 44vw; height: 18vh; opacity: 0.85; animation-duration: 70s; animation-delay: 3s; }
        .cloud-3  { top: 10%; left: 28%;  width: 36vw; height: 16vh; opacity: 0.80; animation-duration: 48s; animation-delay: 8s; }
        .cloud-4  { top: 34%; left: -5%;  width: 55vw; height: 24vh; opacity: 0.88; animation-duration: 82s; animation-delay: 2s; }
        .cloud-5  { top: 42%; right: -4%; width: 48vw; height: 20vh; opacity: 0.82; animation-duration: 63s; animation-delay: 5s; }
        .cloud-6  { top: 28%; left: 48%;  width: 32vw; height: 14vh; opacity: 0.75; animation-duration: 44s; animation-delay: 11s; }
        .cloud-7  { top: 56%; left: 10%;  width: 60vw; height: 26vh; opacity: 0.90; animation-duration: 90s; animation-delay: 1s; }
        .cloud-8  { top: 0%;  left: 60%;  width: 42vw; height: 18vh; opacity: 0.70; animation-duration: 58s; animation-delay: 7s; }
        @keyframes cloudDrift {
            from { transform: translateX(0)    scaleY(1);    }
            to   { transform: translateX(5vw)  scaleY(1.06); }
        }

        /* ── LIGHTNING BOLT SVG (appears during flash) ── */
        #bolt-svg {
            position: absolute;
            top: 8%; right: 24%;
            width: clamp(40px, 6vw, 80px);
            opacity: 0;
            filter: drop-shadow(0 0 18px rgba(255,240,140,0.9));
            pointer-events: none;
            animation: boltAppear 10s 4s ease-in-out infinite;
        }
        @keyframes boltAppear {
            0%, 78%, 84%, 88%, 94%, 100% { opacity: 0; }
            80%  { opacity: 0.95; }
            82%  { opacity: 0; }
            86%  { opacity: 0.70; }
            90%  { opacity: 0; }
            96%  { opacity: 0.50; }
        }

        /* ── LIGHTNING FLASH — sulphurous yellow-white strobe ── */
        #lightning-flash {
            position: absolute;
            inset: 0;
            background: rgba(255, 248, 200, 1);
            opacity: 0;
            pointer-events: none;
            animation: stormFlash 10s 4s ease-in-out infinite;
        }
        @keyframes stormFlash {
            0%, 78%, 84%, 88%, 94%, 100% { opacity: 0; }
            80%  { opacity: 0.80; }
            82%  { opacity: 0; }
            86%  { opacity: 0.55; }
            90%  { opacity: 0; }
            96%  { opacity: 0.35; }
        }

        /* ── WIND STREAKS — warm amber tint ── */
        .wind {
            position: absolute;
            height: 1px;
            background: linear-gradient(to right, transparent 0%, rgba(160,140,60,0.20) 45%, rgba(160,140,60,0.20) 55%, transparent 100%);
            pointer-events: none;
            animation: windSweep linear infinite;
        }
        .wind:nth-child(1)  { top: 12%; width: 35%; animation-duration: 3.2s; animation-delay: 0s; }
        .wind:nth-child(2)  { top: 23%; width: 50%; animation-duration: 2.6s; animation-delay: 0.8s; }
        .wind:nth-child(3)  { top: 35%; width: 28%; animation-duration: 4.1s; animation-delay: 1.5s; }
        .wind:nth-child(4)  { top: 47%; width: 42%; animation-duration: 2.9s; animation-delay: 0.3s; }
        .wind:nth-child(5)  { top: 58%; width: 38%; animation-duration: 3.6s; animation-delay: 1.1s; }
        .wind:nth-child(6)  { top: 70%; width: 55%; animation-duration: 2.4s; animation-delay: 0.6s; }
        .wind:nth-child(7)  { top: 80%; width: 30%; animation-duration: 3.8s; animation-delay: 1.9s; }
        .wind:nth-child(8)  { top: 6%;  width: 45%; animation-duration: 2.8s; animation-delay: 2.2s; }
        @keyframes windSweep {
            from { transform: translateX(-120%); }
            to   { transform: translateX(240%); }
        }

        /* ── VIGNETTE ── */
        .vignette {
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 28%, rgba(0,2,6,0.80) 100%);
            pointer-events: none;
        }

        /* ── DOORWAY ── */
        .door-wrap {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .door-frame {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: clamp(240px, 32vw, 340px);
            opacity: 0;
            animation: doorReveal 1s 1.5s ease-out forwards;
        }
        @keyframes doorReveal {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .door-arch {
            width: 100%;
            height: clamp(130px, 17vw, 200px);
            border: 1px solid #5a4410;
            border-bottom: none;
            border-radius: 50% 50% 0 0 / 100% 100% 0 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #705818;
            background: rgba(4,3,0,0.40);
            box-shadow: 0 0 28px rgba(200,170,40,0.14), inset 0 0 40px rgba(80,60,0,0.10);
        }
        .door-body {
            width: 100%;
            border: 1px solid #5a4410;
            border-top: none;
            padding: 24px 30px 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: rgba(4,3,0,0.40);
        }
        .door-input {
            font-family: 'Cinzel', serif;
            font-size: 0.88rem;
            letter-spacing: 0.5em;
            text-align: center;
            color: #b09030;
            background: transparent;
            border: none;
            border-bottom: 1px solid #5a4410;
            width: 100%;
            padding: 8px 0;
            outline: none;
            caret-color: #b09030;
        }
        .door-input::placeholder { color: rgba(176,144,48,0.3); }
        .door-error {
            font-family: 'Cinzel', serif;
            font-size: 0.66rem;
            letter-spacing: 0.32em;
            text-transform: uppercase;
            color: rgba(220,180,60,0.85);
            opacity: 0;
            transition: opacity 0.3s;
            min-height: 16px;
        }
        .door-proceed {
            font-family: 'Cinzel', serif;
            font-size: clamp(0.70rem, 1.5vw, 0.85rem);
            letter-spacing: 0.38em;
            text-transform: uppercase;
            color: #b09030;
            background: transparent;
            border: 1px solid #5a4410;
            padding: 0.75em 2.4em;
            cursor: pointer;
            transition: color 0.4s, border-color 0.4s, box-shadow 0.4s;
            margin-top: 4px;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        .door-proceed:hover {
            color: #e8cc60;
            border-color: #907820;
            box-shadow: 0 0 22px rgba(200,170,40,0.38);
        }
        @keyframes inputShake {
            0%, 100% { transform: translateX(0); }
            20%       { transform: translateX(-6px); }
            40%       { transform: translateX(6px); }
            60%       { transform: translateX(-4px); }
            80%       { transform: translateX(4px); }
        }
        .door-input.shake { animation: inputShake 0.45s ease-in-out; }

        /* ── EXIT OVERLAY ── */
        #exit-overlay {
            position: fixed;
            inset: 0;
            z-index: 999;
            background: #000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.7s ease;
        }

        @media (max-width: 600px) {
            .door-frame   { width: clamp(200px, 82vw, 280px); }
            .door-proceed { font-size: 0.70rem; letter-spacing: 0.28em; padding: 0.65em 1.8em; }
        }
    </style>
</head>
<body>
    <div id="exit-overlay"></div>

    <div class="scene" id="scene">
        <div class="storm-bg"></div>
        <div class="yellow-haze"></div>

        <!-- Storm clouds -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>
        <div class="cloud cloud-5"></div>
        <div class="cloud cloud-6"></div>
        <div class="cloud cloud-7"></div>
        <div class="cloud cloud-8"></div>

        <!-- Wind -->
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>
        <div class="wind"></div>

        <!-- Lightning bolt SVG -->
        <svg id="bolt-svg" viewBox="0 0 50 95" fill="rgba(255,240,160,0.95)" xmlns="http://www.w3.org/2000/svg">
            <polygon points="36,3 13,50 27,50 17,92 44,42 29,42 48,3"/>
        </svg>

        <!-- Full-sky flash -->
        <div id="lightning-flash"></div>

        <div class="vignette"></div>

        <div class="door-wrap">
            <div class="door-frame" id="doorFrame">
                <div class="door-arch">
                    <svg viewBox="0 0 22 40" width="28" height="52" fill="currentColor" opacity="0.50">
                        <polygon points="15,2 6,20 12,20 8,38 20,18 13,18 21,2"/>
                    </svg>
                </div>
                <div class="door-body">
                    <input type="password" class="door-input" id="doorInput" placeholder="· · · ·" maxlength="12" autocomplete="off">
                    <div class="door-error" id="doorError">denied</div>
                    <button class="door-proceed" id="doorProceed">proceed</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        /* ── RANDOMISE LIGHTNING BOLT POSITION on each animation cycle ── */
        const bolt = document.getElementById('bolt-svg');

        function moveBolt() {
            bolt.style.top   = (4  + Math.random() * 40 | 0) + '%';
            bolt.style.left  = (8  + Math.random() * 68 | 0) + '%';
            bolt.style.right = 'auto';
        }

        // Fire once when the animation begins (after its 4s delay)
        // then on every subsequent iteration
        bolt.addEventListener('animationstart',     moveBolt);
        bolt.addEventListener('animationiteration', moveBolt);

        /* ── DOORWAY ── */
        const doorInput   = document.getElementById('doorInput');
        const doorError   = document.getElementById('doorError');
        const doorProceed = document.getElementById('doorProceed');

        function tryEnter() {
            if (doorInput.value === '1234') {
                const exit = document.getElementById('exit-overlay');
                exit.style.opacity = '1';
                exit.style.pointerEvents = 'all';
                setTimeout(() => { window.location.href = 'mountain.html'; }, 750);
            } else {
                doorInput.classList.remove('shake');
                void doorInput.offsetWidth;
                doorInput.classList.add('shake');
                doorError.style.opacity = '1';
                doorInput.value = '';
                setTimeout(() => {
                    doorError.style.opacity = '0';
                    doorInput.classList.remove('shake');
                }, 1400);
            }
        }

        doorProceed.addEventListener('click', tryEnter);
        doorInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryEnter(); });
    </script>
</body>
</html>
